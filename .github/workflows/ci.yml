name: reproducibility-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: environment/requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary=:all: --requirement environment/requirements-lock.txt
          python -m pip install --no-deps --editable .
      - name: Validate artifact
        run: python scripts/ci_check.py

  container-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build container
        run: docker build --tag certified-fdr-reproducibility:ci .
      - name: Run container checks
        run: docker run --rm certified-fdr-reproducibility:ci
